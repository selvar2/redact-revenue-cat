# XcodeGen manifest — the project file is GENERATED, never hand-edited.
#
# Why: parallel coding agents adding files would produce constant .pbxproj merge
# conflicts. Here they add files to disk and run `xcodegen generate`; the project
# structure is declarative, diffable, and conflict-free.
#
#   xcodegen generate     # after adding or removing any source file

name: RedactApp
options:
  bundleIdPrefix: com.senthilnathanraja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Strict concurrency is a project rule (CLAUDE.md #5), enforced by the compiler
    # rather than by review.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Required for device builds and TestFlight. Not a secret — the Team ID appears
    # in every provisioning profile and in the App ID prefix.
    DEVELOPMENT_TEAM: "8837BPRM4M"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  RedactApp:
    type: application
    platform: iOS
    sources:
      - path: RedactApp
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senthilnathanraja.redact
        INFOPLIST_FILE: RedactApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Dark-only for v1 — see DEC-002. A light theme doubles the token surface
        # and QA matrix for no award benefit.
        UIUserInterfaceStyle: Dark
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  RedactAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RedactApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RedactApp:
    build:
      targets:
        RedactApp: all
        RedactAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RedactAppTests
